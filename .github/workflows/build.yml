name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore Source/

    - name: Build
      run: dotnet build Source/ --no-restore

    - name: Package mod
      run: |
        mkdir -p RimTalkDistanceControl/1.6/Assemblies
        cp -r About RimTalkDistanceControl/About
        find 1.6/Assemblies -name '*.dll' -exec cp {} RimTalkDistanceControl/1.6/Assemblies/ \;
        zip -r RimTalkDistanceControl.zip RimTalkDistanceControl/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: RimTalkDistanceControl
        path: RimTalkDistanceControl.zip
        retention-days: 30

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ github.ref_name }}
        files: RimTalkDistanceControl.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
